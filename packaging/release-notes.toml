# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.3"

[locales."en-us"]
whats-new = """
Video messages now open on the front camera, so you can see yourself while \
you record. The camera's flip button still switches to the back one.

This builds on 1.7.0, which made voice and video messages a way to write an \
email: record from the message bar, and Zirbe transcribes it on your device so \
anyone can read what you said. The inbox filter shows conversations with voice \
or video messages.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
