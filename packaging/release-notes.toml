# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.1"

[locales."en-us"]
whats-new = """
On iPad, a long account name at the top of the inbox no longer pushes the \
Select and Settings buttons into an overflow menu. The name shortens to fit, \
and both buttons stay in place.
"""
