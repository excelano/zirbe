# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.4"

[locales."en-us"]
whats-new = """
This release makes voice and video messages more dependable. A voice message \
now waits for its transcript before it sends, so the words always reach the \
email, and a received one shows its transcript as the conversation's preview \
straight away. A transcription that fails tries again the next time you open \
the message.

Conversations with voice or video messages now stay in the inbox filter after \
a sync, and mail you received before 1.7 shows up there too. Picking several \
videos at once sends all of them, and leaving a conversation mid-recording \
stops the microphone.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
