# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.5.0"

[locales."en-us"]
whats-new = """
Sign in with Microsoft. Outlook.com, Hotmail, Live, and Microsoft 365 accounts \
now sign in on Microsoft's own page, so Zirbe never sees your Microsoft \
password and you don't need an app password. Zirbe stays signed in and renews \
access on its own.

Email on your own domain hosted by Microsoft 365 works too: type your address \
and choose Sign in with Microsoft.

On iPad, a long account name at the top of the inbox no longer hides the \
Select and Settings buttons, and the conversation list is a little wider.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
