# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.4.0"

[locales."en-us"]
whats-new = """
Zirbe now holds more than one email account. Add one from Settings, give each \
a label and a color, and switch between them from the folder list. A new \
conversation is sent from the account you're viewing, or pick another on the \
From line, and a reply comes from the conversation's own account. \
Notifications and the app badge cover every account.

With more than one account, Zirbe opens to All Inboxes: every inbox in one \
list, each conversation marked with its account's color.

Search can now reach older mail. A button below your results searches the \
whole folder on your mail server, not only what's on your device.

Zirbe now runs on iPad, with your conversations in a list beside the one \
you're reading.

Zirbe opens faster, showing your inbox from what's already on your device \
while it catches up, and deleting or archiving several conversations in a row \
keeps up.

If your password changes, Zirbe asks for it again with your mail server \
settings already filled in.

As always, Zirbe talks only to your own mail servers. No backend, no analytics, \
no third-party SDKs.
"""
