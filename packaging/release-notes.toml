# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.8"

[locales."en-us"]
whats-new = """
Mail sent without a date, as some automated alerts are, now sorts by when it \
arrived. Before, it fell to the bottom of the inbox and looked missing.

Drafts and sent copies are filed in your server's own Drafts and Sent \
folders, and editing or sending a draft removes only that draft. On Gmail \
and Outlook, the folder list shows Drafts and Sent once instead of twice.

A message whose text failed to load is fetched again instead of staying \
blank.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
